<script>
"use strict";
/* ================= Telegram setup ================= */
const tg = window.Telegram && window.Telegram.WebApp ? window.Telegram.WebApp : null;
try{ if(tg){ tg.ready(); tg.expand(); } }catch(e){}

/* single light theme — always */
function applyTheme(){
  document.documentElement.dataset.theme = 'light';
  try{
    if(tg && tg.setHeaderColor) tg.setHeaderColor('#FFFFFF');
    if(tg && tg.setBackgroundColor) tg.setBackgroundColor('#F2F4FA');
  }catch(e){}
}
applyTheme();
try{ if(tg && tg.onEvent) tg.onEvent('themeChanged', applyTheme); }catch(e){}

function haptic(type){
  try{
    const h = tg && tg.HapticFeedback;
    if(!h) return;
    if(type==='ok') h.notificationOccurred && h.notificationOccurred('success');
    else if(type==='err') h.notificationOccurred && h.notificationOccurred('error');
    else h.impactOccurred && h.impactOccurred(type||'light');
  }catch(e){}
}

/* ================= Auth + API ================= */
const AUTH = Object.fromEntries(new URLSearchParams(location.search));
/* SaaS session token (stateless, signed by server) */
const SESS = {
  token: localStorage.getItem('sess_token') || '',
  me: (()=>{ try{ return JSON.parse(localStorage.getItem('sess_me')||'null'); }catch(e){ return null; } })(),
  set(t, me){ this.token = t || ''; this.me = me || null;
    try{ if(this.token) localStorage.setItem('sess_token', this.token); else localStorage.removeItem('sess_token');
         if(this.me) localStorage.setItem('sess_me', JSON.stringify(this.me)); else localStorage.removeItem('sess_me');
    }catch(e){} },
  clear(){ this.token=''; this.me=null; try{ localStorage.removeItem('sess_token'); localStorage.removeItem('sess_me'); }catch(e){} },
  loggedIn(){ return !!this.token && !!this.me; }
};
function planStyle(key){
  const c = { free:['var(--plan-free)','var(--plan-free-bg)'], pro:['var(--plan-pro)','var(--plan-pro-bg)'], proplus:['var(--plan-proplus)','var(--plan-proplus-bg)'] }[String(key||'').toLowerCase()] || ['var(--ink2)','var(--surface2)'];
  return { color:c[0], background:c[1] };
}
/* normalise /api/auth/me into SESS.me */
function storeSessMe(d){
  const u = (d && d.user) || {};
  const pl = (d && d.plan && typeof d.plan === 'object') ? d.plan : {};
  return {
    ...u,
    plan_key: pl.key || u.plan || 'free',
    plan_label: pl.label || pl.key || u.plan || 'free',
    orders_limit: pl.orders ? Number(pl.orders) : 0,
    used_today: num(d && d.used_today, u && u.used_today),
    orders_left: (d && d.orders_left != null) ? d.orders_left : null,
    trial: !!(d && d.trial),
    trials_left: (d && d.trials_left != null) ? num(d.trials_left) : null,
    used_trial: (d && d.used_trial != null) ? num(d.used_trial) : null,
    devices: u.devices, accounts: u.accounts, role: u.role, id: u.id, username: u.username
  };
}

/* ================= device isolation ================= */
function getDeviceId(){
  let did = localStorage.getItem('device_id');
  if(!did){
    const m = document.cookie.match(/(?:^|; )device_id=([^;]+)/);
    if(m) did = m[1];
  }
  if(!did){
    did = 'dev_' + Math.random().toString(36).slice(2,14) + Date.now().toString(36);
  }
  try{
    localStorage.setItem('device_id', did);
    document.cookie = 'device_id='+did+'; path=/; max-age=31536000';
  }catch(e){}
  return did;
}

function api(path, opts){
  const u = new URL(path, location.origin);
  u.search = new URLSearchParams({ ...AUTH, ...((opts && opts.q) || {}) });
  const headers = {
    'Content-Type': 'application/json',
    'X-Device-ID': getDeviceId(),
    'X-Tg-Init-Data': ((window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) || (new URLSearchParams(location.search).get('tgib')) || '')
  };
  if(SESS.token) headers['X-Session'] = SESS.token;
  return fetch(u, {
    method: (opts && opts.method) || 'GET',
    headers,
    body: opts && opts.body ? JSON.stringify(opts.body) : undefined
  }).then(async r => {
    // Never surface a bare "network error" — read the real body so server
    // failures (even non-JSON 500s) show their actual message.
    let d;
    try{ d = await r.json(); }
    catch(e){ d = null; }
    if(d === null || d === undefined){
      const txt = await r.text().catch(()=> '');
      const real = txt && !/^<(pre|h1|null)/i.test(txt) ? txt.trim() : '';
      return { error: real || 'Server error ('+r.status+')', _status: r.status, ok:false };
    }
    if((r.status === 401 || d?.error === 'unauthorized' || d?.error === 'session_expired') &&
       path.indexOf('/api/auth/') !== 0 && path.indexOf('/api/saas/plans') !== 0){
      beginLogin();
    }
    return d;
  });
}
/* ================= SaaS auth ================= */
let loginShown = false;
const LG = { mode:'otp', phone:'', request_id:'', instance_id:'', otpSent:false, resendAt:0, busy:false };
function beginLogin(){
  if(loginShown) return;
  loginShown = true;
  const g = document.getElementById('loginGate');
  if(g){
    g.classList.add('lg-in');
    g.classList.remove('hidden');
    if(!g.querySelector('#lgPane').innerHTML) setLoginMode('otp');
    paintFod();
    loadFod();
  }
}
function closeLogin(){ loginShown = false; const g = document.getElementById('loginGate'); if(g) g.classList.add('hidden'); }
function moveSegPill(){
  try{
    const seg = document.getElementById('lgSeg');
    const pill = document.getElementById('lgSegPill');
    const act = seg && seg.querySelector('button.on');
    if(!seg || !pill || !act) return;
    const sr = seg.getBoundingClientRect();
    const ar = act.getBoundingClientRect();
    pill.style.left = (ar.left - sr.left) + 'px';
    pill.style.width = ar.width + 'px';
  }catch(e){}
}
function setLoginMode(mode){
  LG.mode = ['otp','json','cred'].includes(mode) ? mode : 'otp';
  document.querySelectorAll('#lgSeg button').forEach(b=>b.classList.toggle('on', b.dataset.lgm===LG.mode));
  moveSegPill();
  const pane = document.getElementById('lgPane');
  const note = document.getElementById('lgNote');
  if(LG.mode==='json'){
    pane.innerHTML = '<textarea class="cancel-ta" id="lgJsonTa" rows="5" placeholder=\'{&quot;phone&quot;:&quot;+917076200749&quot;,&quot;user_id&quot;:&quot;592745309&quot;,&quot;xo_token&quot;:&quot;ey...&quot;}\'></textarea>' +
      '<div class="gate-hint">Paste an <b>exported Meesho session</b> (phone + user_id + xo) to log in and link the account instantly, or an SaaS <b>username/password</b> JSON.</div>';
    if(note) note.textContent = 'Paste your Meesho export — your shop opens with the account attached.';
  } else if(LG.mode==='cred'){
    pane.innerHTML = '<input class="ai-input" id="lgUser" placeholder="Username" autocomplete="username">' +
      '<input class="ai-input" id="lgPass" type="password" placeholder="Password" autocomplete="current-password" style="margin-top:8px">';
    if(note) note.textContent = 'Admins use this — normal users can just use OTP.';
  } else {
    renderOtpPane();
    if(note) note.textContent = 'First time? Login with OTP — your shop opens automatically.';
  }
  document.getElementById('lgErr').classList.add('hidden');
  const btn = document.getElementById('lgBtn');
  btn.disabled = false; btn.textContent = loginBtnLabel();
  setTimeout(()=>{ try{ (pane.querySelector('input,textarea')||{}).focus?.(); }catch(e){} }, 120);
}
function renderOtpPane(){
  const pane = document.getElementById('lgPane');
  if(!LG.otpSent){
    pane.innerHTML = '<input class="ai-input" id="lgPhone" inputmode="numeric" maxlength="10" placeholder="Enter 10-digit number">' +
      '<div class="gate-hint">A real Meesho OTP is sent to this number — no password needed.</div>';
  } else {
    const left = Math.max(0, Math.ceil((LG.resendAt - Date.now())/1000));
    pane.innerHTML = '<input class="ai-input" id="lgOtp" inputmode="numeric" maxlength="6" placeholder="Enter OTP (6 digits)" style="text-align:center;font-size:20px;letter-spacing:.35em">' +
      '<div class="otp-meta">OTP sent to +91 <b>' + esc(fmtMobile(LG.phone)) + '</b></div>' +
      '<button class="otp-resend" id="otpResendBtn"' + (left>0 ? ' disabled' : '') + '>' +
        (left>0 ? 'Resend in '+left+'s' : '↻ Resend OTP') + '</button>';
    const rs = document.getElementById('otpResendBtn');
    if(rs) rs.addEventListener('click', ()=>{ if(rs.disabled) return; doOtpSend(true); });
  }
}
function loginBtnLabel(){
  if(LG.mode==='otp') return LG.otpSent ? 'Verify & Log in' : 'Send OTP';
  if(LG.mode==='json') return 'Log in with JSON';
  return 'Log in';
}
function setLoginErr(msg){ const e=document.getElementById('lgErr'); if(e){ e.textContent = msg || ''; e.classList.toggle('hidden', !msg); } }
function setGateBusy(b){
  LG.busy = b;
  const btn = document.getElementById('lgBtn');
  const lab = loginBtnLabel();
  if(btn){ btn.disabled = b; btn.innerHTML = b ? '<span class="spinner"></span>' : lab; }
}
async function doOtpSend(resend){
  const btn = document.getElementById('lgBtn');
  const phone = String((document.getElementById('lgPhone')||{}).value || LG.phone || '').replace(/\D/g,'');
  if(phone.length<10){ setLoginErr('Enter a valid 10-digit number'); haptic('err'); return; }
  setGateBusy(true); setLoginErr('');
  try{
    const d = await api('/api/auth/otp_send', { method:'POST', body:{ phone_number: phone }});
    if(d && d.ok){
      LG.phone = phone; LG.request_id = d.request_id; LG.instance_id = d.instance_id;
      LG.otpSent = true; LG.resendAt = Date.now() + 30000;
      haptic('ok');
      renderOtpPane();
      const b = document.getElementById('lgBtn');
      if(b){ b.disabled = false; b.textContent = 'Verify & Log in'; }
      setLoginErr('');
      startResendTimer();
      setTimeout(()=>{ try{ document.getElementById('lgOtp')?.focus(); }catch(e){} }, 120);
      return;
    }
    setLoginErr(d?.message || d?.error || 'Could not send OTP');
    haptic('err');
  }catch(e){ setLoginErr('Network error — try again.'); }
  setGateBusy(false);
}
function startResendTimer(){
  const t = setInterval(()=>{
    const rs = document.getElementById('otpResendBtn');
    const left = Math.max(0, Math.ceil((LG.resendAt - Date.now())/1000));
    if(!rs){ clearInterval(t); return; }
    if(left>0){ rs.disabled = true; rs.textContent = 'Resend in '+left+'s'; }
    else { rs.disabled = false; rs.textContent = '↻ Resend OTP'; clearInterval(t); }
  }, 1000);
}
async function doOtpVerify(){
  const otp = String((document.getElementById('lgOtp')||{}).value || '').replace(/\D/g,'');
  if(otp.length<4){ setLoginErr('Enter the OTP you received'); haptic('err'); return; }
  setGateBusy(true); setLoginErr('');
  try{
    const d = await api('/api/auth/otp_verify', { method:'POST', body:{
      phone_number: LG.phone, otp, request_id: LG.request_id, instance_id: LG.instance_id }});
    if(d && d.ok && d.token){
      SESS.set(d.token, storeSessMe(d));
      closeLogin();
      toast('Logged in with +91 '+esc(fmtMobile(LG.phone)), 'ok');
      haptic('ok');
      await bootstrap();
      if(S.tab==='home') renderHome();
      return;
    }
    setLoginErr(d?.message || d?.error || 'Verification failed');
    haptic('err');
  }catch(e){ setLoginErr('Network error — try again.'); }
  setGateBusy(false);
}
async function doLoginJson(){
  const raw = (document.getElementById('lgJsonTa').value || '').trim();
  if(!raw){ setLoginErr('Paste your login JSON first.'); return; }
  let cred;
  try{ cred = JSON.parse(raw); }
  catch(e){ setLoginErr('That isn’t valid JSON — double-check the braces.'); return; }
  // A Meesho-account session export (phone + user_id + xo/xo_token) logs you in
  // directly AND imports the account. Otherwise it's an SaaS username/password login.
  const isExport = (typeof cred === 'object' && cred) &&
    ((cred.phone || cred.mobile || cred.number) &&
     (cred.user_id || cred.userId) &&
     (cred.xo || cred.xo_token || cred.authorization));
  if(isExport){
    setGateBusy(true); setLoginErr('');
    try{
      const d = await api('/api/auth/json_login', { method:'POST', body: cred });
      if(d && d.ok && d.token){
        SESS.set(d.token, storeSessMe(d));
        closeLogin();
        haptic('ok');
        toast('Logged in · account +91 '+esc(fmtMobile((cred.phone||cred.mobile||'').replace(/\D/g,'')))+' linked', 'ok');
        await bootstrap();
        if(S.tab==='home') renderHome();
        return;
      }
      setLoginErr(d?.message || d?.error || 'Could not import that Meesho session.');
      haptic('err');
    }catch(e){ setLoginErr('Network error — try again.'); }
    setGateBusy(false);
    return;
  }
  if(typeof cred === 'object' && cred && ('mobile' in cred || 'number' in cred || 'uid' in cred) && !('username' in cred)){
    setLoginErr('That Meesho export is missing phone/user_id/xo — log in with OTP first, then import it from Account → Import from JSON.');
    return;
  }
  if(!cred.username || !cred.password){ setLoginErr('Username and password are both required in the JSON.'); return; }
  await submitLogin(cred);
}
async function doLoginCred(){
  const cred = {
    username: (document.getElementById('lgUser').value || '').trim(),
    password: document.getElementById('lgPass').value || ''
  };
  if(!cred.username || !cred.password){ setLoginErr('Username and password are both required.'); return; }
  await submitLogin(cred);
}
async function submitLogin(cred){
  setGateBusy(true); setLoginErr('');
  try{
    const d = await api('/api/auth/login', { method:'POST', body: cred });
    if(d && d.ok && d.token){
      SESS.set(d.token, storeSessMe(d));
      closeLogin();
      toast('Welcome, '+esc(d.user?.username || cred.username), 'ok');
      haptic('ok');
      await bootstrap();
      if(S.tab==='home') renderHome();
      return;
    }
    setLoginErr(d?.error || d?.message || 'Login failed.');
    haptic('err');
  }catch(e){ setLoginErr('Network error — try again.'); }
  setGateBusy(false);
}
async function doLogout(){
  try{ await api('/api/auth/logout', { method:'POST', body:{} }); }catch(e){}
  SESS.clear();
  toast('Logged out');
  location.reload();
}
function onGateEnter(e){
  if(e.key!=='Enter') return;
  if(LG.mode==='otp'){ if(LG.otpSent) doOtpVerify(); else doOtpSend(); }
  else if(LG.mode==='json') doLoginJson();
  else doLoginCred();
}
window.beginLogin = beginLogin; window.closeLogin = closeLogin;
window.doLogout = doLogout;
window.openPlansSheet = openPlansSheet;
// login gate wiring
document.addEventListener('DOMContentLoaded', ()=>{
  const g = document.getElementById('loginGate');
  if(!g) return;
  g.querySelectorAll('#lgSeg button').forEach(b=>b.addEventListener('click', ()=>setLoginMode(b.dataset.lgm)));

    else if(LG.mode==='json') doLoginJson();

    ncgi.addEventListener('input', ()=>{ const rr = g.querySelector('#ncgRes'); if(rr) rr.innerHTML=''; });
  }
  moveSegPill();
});

/* ================= helpers ================= */
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function rupee(n){
  if(n==null || isNaN(Number(n))) return '₹—';
  const v = Number(n);
  return '₹' + (Number.isInteger(v) ? v.toLocaleString('en-IN') : v.toLocaleString('en-IN', {minimumFractionDigits:2, maximumFractionDigits:2}));
}
function num(x, fallback){
  const n = Number(x == null ? NaN : x);
  return (n === n && isFinite(n)) ? n : (fallback === undefined ? 0 : fallback);
}
/* plan usage helpers */
function ordersLimit(){
  const lim = Number((SESS.me && SESS.me.plan && SESS.me.plan.orders_limit) != null ? SESS.me.plan.orders_limit : (SESS.me && SESS.me.orders_limit) || 0);
  return lim > 0 ? lim : null; // null = unlimited
}
function ordersLeft(){
  const me = SESS.me || {};
  if(me.trial){
    return (me.trials_left != null) ? Math.max(0, me.trials_left) : null;
  }
  const lim = ordersLimit();
  if(lim == null) return null;
  return Math.max(0, lim - num(me.used_today));
}
function escapeHtml(s){
  return String(s==null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, kind){
  const wrap = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast' + (kind ? ' ' + kind : '');
  t.textContent = msg;
  wrap.appendChild(t);
  setTimeout(()=>{ t.classList.add('out'); setTimeout(()=>t.remove(), 260); }, 2400);
}
const PLACEHOLDER = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="300" height="340"><rect width="100%" height="100%" fill="#E6EAF4"/><text x="50%" y="50%" font-size="46" text-anchor="middle" dy=".35em">🛍️</text></svg>');
function imgTag(src, cls){
  return '<img loading="lazy" ' + (cls?('class="'+cls+'" '):'') + 'src="' + esc(src||PLACEHOLDER) + '" onerror="this.onerror=null;this.src=\'' + PLACEHOLDER + '\'" alt="">';
}
function fmtDate(s){
  // "2026-08-20T14:04:36" → "Thu, 20 Aug"; pass through non-ISO strings
  const m = String(s||'').match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(!m) return s;
  const d = new Date(Number(m[1]), Number(m[2])-1, Number(m[3]));
  if(isNaN(d.getTime())) return s;
  const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  const mons = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return days[d.getDay()]+', '+d.getDate()+' '+mons[d.getMonth()];
}
function ratingClass(r){ return r>=4 ? '' : (r>=3 ? 'mid' : 'low'); }
function fmtCount(n){
  const v = Number(n);
  if(isNaN(v)) return '';
  if(v >= 1e6) return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';
  return v.toLocaleString('en-IN');
}

/* ================= bootstrap ================= */
function renderGate(kind){
  const g = document.createElement('div');
  g.className = 'gate'; g.id = 'appGate';
  const m = kind==='maintenance'
    ? '<div class="art">🛠</div><h3>Under maintenance</h3><p>The shop is temporarily closed for maintenance. Please check back shortly.</p>'
    : '<div class="art">🤖</div><h3>Open in Telegram</h3><p>Please open the shop from inside the Telegram bot.</p>';
  g.innerHTML = '<div class="inner">'+m+'</div>';
  document.body.appendChild(g);
}
async function bootstrap(){
  try{
    const me = await api('/api/auth/me');
    if(me && me.authenticated && me.user){
      SESS.set(SESS.token || (me.token||''), storeSessMe(me));
      try{ localStorage.setItem('sess_me', JSON.stringify(SESS.me)); }catch(e){}
    } else {
      SESS.clear();
      beginLogin();
      return;
    }
  }catch(e){ beginLogin(); return; }
  try{
    const d = await api('/api/bootstrap');
    if(d && d.error === 'open_in_telegram'){ renderGate(); return true; }
    if(d && d.maintenance){ renderGate('maintenance'); return true; }
    S.accounts = Array.isArray(d?.accounts) ? d.accounts : [];
    S.activeId = d?.active_id ?? null;
    S.balance = d?.balance ?? 0;
    S.fee = Number(d?.per_order_price ?? 0) || 0;
  }catch(e){
    S.accounts = []; S.activeId = null;
    toast('Could not reach server', 'err');
  }
  renderTopbar();
  if(S.tab==='home') renderHome();
  if(S.tab==='account') renderAccount();
  if(!S.accounts.length){ renderNoAccount(); return; }
  refreshCartBadge();
  refreshOrderTicks();
}

async function refreshOrderTicks(){

function submitNumCheck(phone, btn, res){
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  res.innerHTML = '';
  api('/api/check_registered', {method:'POST', body:{phone_number: phone}})
    .then(d=>{
      btn.disabled = false; btn.innerHTML = '✓ Check';
      if(!d || !d.ok){ res.innerHTML = '<span style="color:#e74c3c">Check failed</span>'; haptic('err'); return; }
      if(d.verified){
        if(d.registered){
          res.innerHTML = '<span style="color:#2ecc71">✓ Registered on Meesho'+(d.sign_up_date?' since '+esc(String(d.sign_up_date).split(' ')[0]):'')+'</span>';
          haptic('ok');
        } else {
          res.innerHTML = '<span style="color:#e67e22">✓ Number is FRESH — not previously used on Meesho</span>';
          haptic('ok');
        }
        return;
      }
      res.innerHTML = '<span style="color:var(--muted)">⚠ No OTP sent.</span> '
        + '<span style="color:var(--ink2)">Meesho can only confirm during login — continue with this number (enters OTP once) and its true FRESH/registered status will be shown &amp; remembered.</span>';
    })
    .catch(()=>{ btn.disabled = false; btn.innerHTML = '✓ Check'; res.innerHTML = '<span style="color:#e74c3c">Network error</span>'; });
}

  const el = document.getElementById('tab-search');
  if(S.searchMode === 'link'){ renderLinkShell(); return; }
  el.innerHTML =
    segTabsHTML() +
    '<form class="search-row" id="searchForm" style="position:relative">' +
      '<div class="search-box"><span class="mag">🔍</span>' +
      '<input id="searchInput" type="search" placeholder="Search for products…" enterkeyhint="search" value="'+esc(S.searchQuery)+'" autocomplete="off">' +
      '</div><button class="search-btn" type="submit">Go</button>' +
    '<div id="suggestBox" style="display:none;position:absolute;top:100%;left:0;right:0;background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,.18);max-height:320px;overflow-y:auto;z-index:999;margin-top:4px"></div>' +
    '</form>' +
    '<div class="mood-row" id="moodRow">' +
      [['😍','Trending','trending'],['🔥','Deals','deals of the day'],['👗','New','new arrivals'],['🥻','Sarees','saree'],['👟','Shoes','shoes'],['🏠','Home','home decor']]
        .map(m=>'<button class="mood-chip" data-q="'+esc(m[2])+'">'+m[0]+' '+m[1]+'</button>').join('') + '</div>' +
    '<div id="recentWrap"></div>' +
    '<div id="correctedWrap"></div>' +
    '<div id="resultsWrap"></div>';
  document.getElementById('searchForm').addEventListener('submit', e=>{
    e.preventDefault();
    const q = document.getElementById('searchInput').value.trim();
    document.getElementById('suggestBox').style.display='none';
    if(q) doSearch(q, true);
  });
  let suggestTimer=null;
  document.getElementById('searchInput').addEventListener('input', e=>{
    clearTimeout(suggestTimer);
    const q=e.target.value.trim();
    if(q.length<2){ document.getElementById('suggestBox').style.display='none'; return; }
    suggestTimer=setTimeout(()=>doSuggest(q),250);
  });
  document.getElementById('searchInput').addEventListener('blur', ()=>setTimeout(()=>document.getElementById('suggestBox').style.display='none',200));
  document.getElementById('moodRow').querySelectorAll('.mood-chip').forEach(b=>b.addEventListener('click', ()=>{
    haptic('light');
    document.getElementById('searchInput').value = b.dataset.q;
    document.getElementById('suggestBox').style.display='none';
    doSearch(b.dataset.q, true);
  }));
  bindSegTabs();
  renderRecents();
  renderResults();
}
async function doSuggest(q){
  try{
    const items=await api('/api/search/suggest',{method:'POST',body:{prefix:q}});
    const box=document.getElementById('suggestBox');
    if(!box) return;
    if(!items||!items.length){ box.style.display='none'; box.innerHTML=''; return; }
    box.innerHTML=items.slice(0,8).map((s,i)=>'<div class="suggest-item" data-i="'+i+'" style="display:flex;align-items:center;gap:10px;padding:10px 14px;cursor:pointer;border-bottom:1px solid #f5f5f5">'+(s.url?'<img src="'+esc(s.url)+'" style="width:32px;height:32px;border-radius:6px;object-fit:cover">':'<span style="width:32px;height:32px;border-radius:6px;background:#f0f0f0;display:flex;align-items:center;justify-content:center">🔍</span>')+'<span style="font-size:14px;font-weight:600">'+esc(s.suggestion)+'</span></div>').join('');
    box.style.display='block';
    box.querySelectorAll('.suggest-item').forEach(el=>el.addEventListener('mousedown',e=>{
      e.preventDefault();
      const sug=items[+el.dataset.i].suggestion;
      const inp=document.getElementById('searchInput');
      const sb=document.getElementById('suggestBox');
      if(inp) inp.value=sug;
      if(sb){ sb.style.display='none'; sb.innerHTML=''; }
      doSearch(sug,true);
    }));
  }catch(e){}
}

async function fetchByLink(){
  const inp = document.getElementById('linkInput');
  const link = (inp && inp.value || '').trim();
  S.linkVal = link;
  if(!link){ toast('Paste a product link first'); return; }
  haptic('med');
  const btn = document.getElementById('linkFetchBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    const d = await api('/api/product/by_link', {method:'POST', body:{link}});
    if(d && !d.error && d.product_id != null){
      haptic('ok');
      openProduct({
        product_id: d.product_id, catalog_id: d.catalog_id,
        name: d.name, image: Array.isArray(d.images) ? d.images[0] : null, images: d.images,
        price: d.price, original_price: d.mrp, sizes: d.sizes,
        supplier_id: d.supplier_id, supplier_name: d.supplier_name,
        mall_verified: d.mall_verified, full_details: d.full_details, description: d.description
      });
    }else if(d?.error === 'bad_link'){
      haptic('err'); toast(d?.message || 'That link doesn’t look like a Meesho product link', 'err');
    }else{
      haptic('err'); toast(d?.message || d?.error || 'Could not fetch that product', 'err');
    }
  }catch(e){ haptic('err'); toast('Network error — try again', 'err'); }
  const btn2 = document.getElementById('linkFetchBtn');
  if(btn2){ btn2.disabled = false; btn2.textContent = 'Fetch'; }
}

async function doSearch(query, reset){
  if(reset){
    haptic('light');
    S.searchQuery = query; S.searchOffset = 0; S.searchResults = []; S.searchDone = false; S.corrected = null;
    S.searchCursor = null; S.searchSession = null; S.searchPageIdx = 0; S.searchPages = [];
    pushRecent(query);
  }
  if(S.searchLoading) return;
  S.searchLoading = true;
  renderRecents(); renderResults();
  try{
    const body = {query: S.searchQuery, offset: S.searchOffset};
    if(S.searchCursor) body.cursor = S.searchCursor;
    if(S.searchSession) body.search_session_id = S.searchSession;
    const d = await api('/api/search', {method:'POST', body});
    if(d?.error){ toast(d.error, 'err'); S.searchError = true; }
    else S.searchError = false;
    const items = Array.isArray(d?.catalogs) ? d.catalogs : [];
    // store this page's items so page navigation works
    if(reset){
      S.searchPages = [items];
      S.searchPageIdx = 0;
    } else {
      S.searchPages[S.searchPageIdx] = items;
    }
    S.searchResults = S.searchPages.filter(Boolean).flat();
    if(d?.corrected_term) S.corrected = d.corrected_term;
    S.searchCursor = d?.cursor || null;
    if(d?.search_session_id) S.searchSession = d.search_session_id;
    S.searchOffset = (S.searchPageIdx+1) * 20;
    if(!items.length || !S.searchCursor) S.searchDone = true;
  }catch(e){
    S.searchError = true;
    toast('Search failed — check connection', 'err');
  }
  S.searchLoading = false;
  renderRecents(); renderResults();
}
async function goSearchPage(i){
  const total = S.searchPages.length;
  if(i < 0 || i > total || i===S.searchPageIdx) return;
  if(i === total && !S.searchDone){
    // load next page
    S.searchPageIdx = total;
    await doSearch(S.searchQuery, false);
  } else {
    S.searchPageIdx = i;
    renderResults();
  }
  window.scrollTo({top:0, behavior:'smooth'});
}
function parseDiscountNum(t){
  const s = String(t||'').replace(/[,₹]/g,'');
  const pct = s.match(/(\d+(?:\.\d+)?)\s*%/);
  if(pct) return Number(pct[1]);
  const off = s.match(/(\d+(?:\.\d+)?)\s*(?:off|OFF)/);
  if(off) return Number(off[1]);
  const m = s.match(/(\d+(?:\.\d+)?)/);
  return m ? Number(m[1]) : 0;
}
function sortedResults(){
  const list = S.searchResults.slice();
  const mode = S.sortMode;
  if(mode==='plh') list.sort((a,b)=>(Number(a?.price)||0)-(Number(b?.price)||0));
  else if(mode==='phl') list.sort((a,b)=>(Number(b?.price)||0)-(Number(a?.price)||0));
  else if(mode==='disc') list.sort((a,b)=>parseDiscountNum(b?.discount_text)-parseDiscountNum(a?.discount_text));
  else if(mode==='rate') list.sort((a,b)=>(Number(b?.rating)||0)-(Number(a?.rating)||0));
  return list;
}
let searchObserver = null;
function attachSearchSentinel(){
  const s = document.getElementById('searchSentinel');
  if(!s) return;
  if(searchObserver) searchObserver.disconnect();
  searchObserver = new IntersectionObserver(entries=>{
    if(entries.some(e=>e.isIntersecting) && !S.searchLoading && !S.searchDone && S.searchCursor){
      doSearch(S.searchQuery, false);
    }
  }, {rootMargin:'300px'});
  searchObserver.observe(s);
}
function skeletonCards(n){
  let h = '';
  for(let i=0;i<n;i++){
    h += '<div class="sk-card"><div class="sk sk-img"></div><div class="b">' +
      '<div class="sk sk-line" style="width:90%"></div><div class="sk sk-line" style="width:65%"></div>' +
      '<div class="sk sk-line" style="width:45%;height:14px"></div></div></div>';
  }
  return h;
}
function renderResults(){
  const wrap = document.getElementById('resultsWrap');
  const cw = document.getElementById('correctedWrap');
  if(!wrap) return;
  cw.innerHTML = (S.corrected && S.corrected.toLowerCase() !== (S.searchQuery||'').toLowerCase())
    ? '<div class="corrected"><span>Meesho searched: <b>'+esc(S.corrected)+'</b></span>' +
      '<button class="corrected-btn" id="origTermBtn">Search “'+esc(S.searchQuery)+'” instead</button></div>' : '';
  const otb = document.getElementById('origTermBtn');
  if(otb) otb.addEventListener('click', ()=>{ haptic('light'); doSearch(S.searchQuery, true); });
  if(S.searchLoading && !S.searchResults.length){
    wrap.innerHTML = '<div class="grid">' + skeletonCards(6) + '</div>';
    return;
  }
  if(!S.searchResults.length){
    if(S.searchError && S.searchQuery && !S.searchLoading){
      wrap.innerHTML = '<div class="err-state"><div class="art">📡</div><h3>Search failed</h3><p>We couldn’t load results. Check your connection and try again.</p>' +
        '<button class="retry-btn" id="searchRetryBtn">Retry</button></div>';
      const rb = document.getElementById('searchRetryBtn');
      if(rb) rb.addEventListener('click', ()=>{ haptic('light'); doSearch(S.searchQuery, true); });
    }else if(S.searchQuery && !S.searchLoading){
      wrap.innerHTML = '<div class="empty"><div class="art">🔎</div><h3>No results</h3><p>Nothing found for “'+esc(S.searchQuery)+'”. Try a different search.</p></div>';
    } else wrap.innerHTML = '';
    return;
  }
  const SORTS = [['rel','Relevance'],['plh','Price ↑'],['phl','Price ↓'],['disc','Discount'],['rate','Rating']];
  let h = '<div class="filter-chips">' + SORTS.map(([k,l])=>
    '<button class="fchip'+(S.sortMode===k?' on':'')+'" data-sort="'+k+'">'+l+'</button>').join('') + '</div>';
  const pageItems = S.searchPages[S.searchPageIdx] || [];
  const shown = pageItems.slice().sort(sortByMode());
  h += '<div class="grid">';
  shown.forEach((c,i)=>{
    const r = c?.rating;
    h += '<div class="pcard" data-idx="'+i+'" style="animation-delay:'+Math.min((i%20)*30,300)+'ms">' +
      '<div class="imgwrap">'+ imgTag(c?.image) + (c?.mall_verified ? '<span class="mall-badge">Mall</span>' : '') + '</div>' +
      '<div class="body"><div class="name">'+esc(c?.name||'Product')+'</div>' +
      '<div class="price-line"><span class="p">'+rupee(c?.price)+'</span>' +
      (c?.original_price && c.original_price>c?.price ? '<span class="mrp">'+rupee(c.original_price)+'</span>' : '') +
      (c?.discount_text ? '<span class="off">'+esc(c.discount_text)+'</span>' : '') + '</div>' +
      '<div class="meta-line">' +
      (r ? '<span class="rating-badge '+ratingClass(r)+'">★ '+esc(Number.isFinite(num(r)) ? Number(num(r)).toFixed(1) : '—')+'</span>' : '') +
      (c?.supplier_name ? '<span class="supplier">'+esc(c.supplier_name)+'</span>' : '') +
      '</div>' +
      (Array.isArray(c?.tags) && c.tags.length ? '<div class="speed-chips">'+c.tags.slice(0,2).map(t=>'<span class="speed-chip">⚡ '+esc(t)+'</span>').join('')+'</div>' : '') +
      '<div class="addpill">➕ Add</div>' +
      '</div></div>';
  });
  h += '</div>';
    // pager
    const totalPages = S.searchPages.length;
    if(totalPages){
      let pager = '<div class="pager">';
      pager += '<button class="page-btn" data-pg="'+(S.searchPageIdx-1)+'" '+(S.searchPageIdx===0?'disabled':'')+'>‹ Prev</button>';
      // Numbered pages: we render only already-loaded pages. If more results are
      // pending (search not done), the NEXT-UNLOADED page is shown as its own
      // button below — so never let the numbered loop reach it (avoids dupe).
      const loopEnd = (!S.searchDone && S.searchCursor) ? (totalPages-1) : totalPages;
      const start = Math.max(0, S.searchPageIdx-2);
      const end = Math.max(start, Math.min(loopEnd, start+5));
      for(let p=start; p<end; p++){
        pager += '<button class="page-num'+(p===S.searchPageIdx?' on':'')+'" data-pg="'+p+'">'+(p+1)+'</button>';
      }
      if(!S.searchDone && S.searchCursor){
        pager += '<button class="page-num'+(S.searchPageIdx===totalPages?' on':'')+'" data-pg="'+totalPages+'">'+(totalPages+1)+'</button>';
      }
      pager += '<button class="page-btn" data-pg="'+(S.searchPageIdx+1)+'" '+(S.searchDone&&S.searchPageIdx===totalPages-1?'disabled':'')+'>Next ›</button>';
      pager += '</div>';
      h += pager;
    }
  if(S.searchLoading) h += '<div class="sentinel-row"><div class="spinner"></div></div>';
  else if(!S.searchDone && S.searchPages.length===0) h += '<div class="sentinel-row" id="searchSentinel"><div class="spinner" style="visibility:hidden"></div></div>';
  else if(shown.length) h += '<div class="end-note">Page '+(S.searchPageIdx+1)+' of results for “'+esc(S.searchQuery)+'”</div>';
  wrap.innerHTML = h;
  wrap.querySelectorAll('.pcard').forEach(el=>el.addEventListener('click', ()=>openProduct(shown[Number(el.dataset.idx)])));
  wrap.querySelectorAll('[data-sort]').forEach(b=>b.addEventListener('click', ()=>{
    haptic('light'); S.sortMode = b.dataset.sort; renderResults();
    window.scrollTo({top:0, behavior:'smooth'});
  }));
  wrap.querySelectorAll('[data-pg]').forEach(b=>b.addEventListener('click', ()=>{
    const pg = Number(b.dataset.pg);
    if(b.disabled) return;
    haptic('light');
    goSearchPage(pg);
  }));
  attachSearchSentinel();
}
function sortByMode(){
  const mode = S.sortMode;
  if(mode==='plh') return (a,b)=>(Number(a?.price)||0)-(Number(b?.price)||0);
  if(mode==='phl') return (a,b)=>(Number(b?.price)||0)-(Number(a?.price)||0);
  if(mode==='disc') return (a,b)=>parseDiscountNum(b?.discount_text)-parseDiscountNum(a?.discount_text);
  if(mode==='rate') return (a,b)=>(Number(b?.rating)||0)-(Number(a?.rating)||0);
  return () => 0;
}

/* ================= PRODUCT DETAIL ================= */
const P = { current:null, size:null, qty:1, varData:null, varLoading:false, adding:false, pdp:null, pdpLoading:false, pdpSeq:0 };
function mergedProduct(){
  const c = P.current || {};
  const p = P.pdp || {};
  const pick = (a,b)=> (a!=null && !(Array.isArray(a)&&!a.length) && a!=='') ? a : b;
  return {
    ...c,
    name: pick(p.name, c.name),
    brand: p.brand,
    price: pick(p.price, c.price),
    original_price: pick(p.mrp, c.original_price),
    image: pick(p.images && p.images[0], c.image),
    images: pick(p.images, c.images),
    sizes: pick(p.sizes, c.sizes),
    supplier_id: pick(p.supplier_id, c.supplier_id),
    supplier_name: pick(p.supplier_name, c.supplier_name),
    mall_verified: pick(p.mall_verified, c.mall_verified),
    full_details: pick(p.full_details, c.full_details),
    description: pick(p.description, c.description),
    highlights: Array.isArray(p.highlights) ? p.highlights : [],
    supplier_rating: p.supplier_rating,
    supplier_rating_count: p.supplier_rating_count,
    review_sentiment: Array.isArray(p.review_sentiment) ? p.review_sentiment : [],
    designs: Array.isArray(p.designs) ? p.designs : [],
    in_stock: p.in_stock,
    product_id: pick(p.product_id, c.product_id),
    catalog_id: pick(p.catalog_id, c.catalog_id)
  };
}
window.openOrderProduct = function(pid){
  if(pid == null) return;
  haptic('light');
  openProduct({product_id: pid, sizes: []});
};
function openProduct(c, replace){
  if(!c) return;
  haptic('light');
  P.current = c; P.qty = 1; P.varData = null; P.varLoading = false; P.adding = false;
  P.pdp = null; P.pdpLoading = true;
  P.size = (Array.isArray(c.sizes) && c.sizes.length) ? c.sizes[0] : null;
  if(!replace) S.detailStack.push('product');
  renderProductDetail();
  syncBackButton();
  if(P.size) fetchVariation();
  loadPdp(c.product_id);
}
async function loadPdp(productId){
  if(productId==null){ P.pdpLoading = false; return; }
  const seq = ++P.pdpSeq;
  try{
    const d = await api('/api/product', {q:{product_id: productId}});
    if(seq !== P.pdpSeq || !S.detailStack.length) return; // stale or closed
    P.pdpLoading = false;                    // fetch done → clear skeleton
    if(d && !d.error && d.product_id != null){
      P.pdp = d;
      // re-map selected size onto PDP sizes
      const sizes = Array.isArray(d.sizes) && d.sizes.length ? d.sizes : (Array.isArray(P.current?.sizes)?P.current.sizes:[]);
      let next = null;
      if(P.size) next = sizes.find(s=>s.variation_id===P.size.variation_id) || sizes.find(s=>s.name===P.size.name) || null;
      if(!next && sizes.length) next = sizes[0];
      const changed = (next?.variation_id) !== (P.size?.variation_id);
      P.size = next;
      renderProductDetail();                 // pdpLoading is false now → real UI
      const si = document.getElementById('shipInfo'); if(si) si.innerHTML = shipInfoHTML();
      if(changed && P.size) fetchVariation();
    }else{
      renderProductDetail();                 // error → clear skeleton, show whatever we have
    }
  }catch(e){
    if(seq === P.pdpSeq){ P.pdpLoading = false; renderProductDetail(); }
  }
}
function parseFullDetails(txt){
  const kv = []; const rest = [];
  String(txt||'').split('\n').forEach(line=>{
    const l = line.trim();
    if(!l) return;
    const m = l.match(/^([^:]{1,40}):\s*(.*)$/);
    if(m && m[2]) kv.push([m[1].trim(), m[2].trim()]);
    else if(m && !m[2]) kv.push([m[1].trim(), '']);
    else if(kv.length && kv[kv.length-1][1]==='') kv[kv.length-1][1] = l;
    else if(kv.length && /^[A-Za-z0-9]/.test(l) && l.length<80 && kv[kv.length-1][0].toLowerCase().includes('size')) kv[kv.length-1][1] += '\n' + l;
    else rest.push(l);
  });
  return {kv, rest};
}
function renderProductDetail(){
  if(!P.current) return;
  const c = mergedProduct();
  const host = document.getElementById('detailHost');
  const images = (Array.isArray(c.images) && c.images.length) ? c.images : (c.image ? [c.image] : []);
  const {kv, rest} = parseFullDetails(c.full_details);
  const sizes = Array.isArray(c.sizes) ? c.sizes : [];

  // Show a skeleton body on every product open until the PDP finishes loading
  if(P.pdpLoading){
    host.innerHTML = '<div class="detail" id="productDetail">'
      + '<div class="detail-top"><button class="back-btn" onclick="closeDetail()">←</button><div class="ttl">Loading…</div></div>'
      + '<div class="gallery"><div class="sk" style="width:100%;aspect-ratio:1/1.1;border-radius:0"></div></div>'
      + '<div class="card"><div class="sk sk-line" style="width:72%;height:16px;margin-bottom:12px"></div>'
      + '<div class="sk" style="width:38%;height:26px;border-radius:999px;margin-bottom:10px"></div>'
      + '<div class="sk sk-line" style="width:55%;height:12px"></div></div>'
      + '<div class="card"><div class="sec-title">Highlights</div><div class="hl-grid">'

    '<div id="priceBlock">'+priceBlockHTML()+'</div>' +

      (c.supplier_rating_count!=null ? ' · '+fmtCount(c.supplier_rating_count)+' ratings' : '') + '</span>' : '') +

    h += '<div class="card"><div class="sec-title">Select size</div><div class="size-chips" id="sizeChips">' +
      sizes.map((s,i)=>'<button class="size-chip'+(P.size && s.variation_id===P.size.variation_id?' on':'')+'" data-si="'+i+'">'+esc(s.name||'?')+'</button>').join('') +
      '</div></div>';
  }

  // quantity
  h += '<div class="card"><div class="qty-row"><div class="sec-title" style="margin:0">Quantity</div>' +
    '<div class="stepper"><button id="qMinus">−</button><span class="qv" id="qVal">'+P.qty+'</span><button id="qPlus">+</button></div></div></div>';

  // review sentiment ("What customers say")
  const sents = Array.isArray(c.review_sentiment) ? c.review_sentiment.filter(x=>x && x.label) : [];
  if(sents.length){
    h += '<div class="card"><div class="sec-title">What customers say</div>' +
      sents.map(sx=>{
        const pct = Math.max(0, Math.min(100, Number(sx?.positive_pct)||0));
        return '<div class="sent-row"><div class="sent-head">' +
          (sx?.icon ? '<img src="'+esc(sx.icon)+'" onerror="this.remove()" alt="">' : '') +
          '<span class="sl">'+esc(sx.label)+'</span>' +
          '<span class="sp" style="color:'+esc(sx?.stroke_color||'var(--green)')+'">'+pct+'%</span></div>' +

          '<div class="fill" style="width:'+pct+'%;background:'+esc(sx?.stroke_color||'var(--green)')+'"></div></div>' +

  const hls = Array.isArray(c.highlights) ? c.highlights.filter(x=>x && (x.name||x.value)) : [];

  // gallery dots
  const track = document.getElementById('galTrack');

  if(track && dots){
    track.addEventListener('scroll', ()=>{

      dots.querySelectorAll('span').forEach((d,j)=>d.classList.toggle('on', j===i));
    }, {passive:true});
  }
  // designs
  const ds = document.getElementById('designStrip');
  if(ds) ds.addEventListener('click', e=>{
    const b = e.target.closest('.design-card'); if(!b) return;
    const dz = designs[Number(b.dataset.di)];
    if(!dz || dz.product_id===c.product_id) return;
    if(dz.in_stock===false){ toast('This design is out of stock'); return; }
    haptic('light');
    const dt = document.getElementById('productDetail'); if(dt) dt.scrollTop = 0;
    openProduct({
      product_id: dz.product_id, name: dz.name || c.name, image: dz.image,
      price: dz.price, supplier_id: c.supplier_id, supplier_name: c.supplier_name,
      catalog_id: c.catalog_id, mall_verified: c.mall_verified
    }, true);
  });
  // sizes
  const sc = document.getElementById('sizeChips');
  if(sc) sc.addEventListener('click', e=>{
    const b = e.target.closest('.size-chip'); if(!b) return;
    haptic('light');
    P.size = sizes[Number(b.dataset.si)];
    sc.querySelectorAll('.size-chip').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');
    fetchVariation();

  // qty
  document.getElementById('qMinus').addEventListener('click', ()=>{ if(P.qty>1){ P.qty--; haptic('light'); document.getElementById('qVal').textContent=P.qty; } });
  document.getElementById('qPlus').addEventListener('click', ()=>{ if(P.qty<10){ P.qty++; haptic('light'); document.getElementById('qVal').textContent=P.qty; } });
  // cta
  const acb = document.getElementById('addCartBtn');
  acb.addEventListener('click', addToCart);
  const bnb = document.getElementById('buyNowBtn');
  if(bnb) bnb.addEventListener('click', addToCart);
  if(c.in_stock===false || (P.varData && P.varData.in_stock===false)){

    if(bnb){ bnb.disabled = true; bnb.textContent = 'Out of Stock'; }
  }
}
function priceBlockHTML(){

async function fetchVariation(){
  if(!P.current) return;
  const c = mergedProduct();
  const vid = P.size?.variation_id;
  if(vid==null) return;
  P.varLoading = true; P.varData = null;
  const pb = document.getElementById('priceBlock'); if(pb) pb.innerHTML = priceBlockHTML();
  const si = document.getElementById('shipInfo'); if(si) si.innerHTML = '';
  try{
    const d = await api('/api/variation', {method:'POST', body:{product_id: c.product_id, supplier_id: c.supplier_id, variation_id: vid}});
    if(d?.error){ toast(d.error, 'err'); }
    else P.varData = d;
  }catch(e){ toast('Could not load size details', 'err'); }
  P.varLoading = false;
  const pb2 = document.getElementById('priceBlock'); if(pb2) pb2.innerHTML = priceBlockHTML();
  const si2 = document.getElementById('shipInfo'); if(si2) si2.innerHTML = shipInfoHTML();
  const btn = document.getElementById('addCartBtn');
  const bn = document.getElementById('buyNowBtn');
  const oos = P.varData && P.varData.in_stock===false;
  if(btn){ if(oos){ btn.disabled=true; btn.textContent='Out of Stock'; } else { btn.disabled=false; btn.innerHTML='Add to Cart 🛒'; } }
  if(bn){ if(oos){ bn.disabled=true; bn.textContent='Out of Stock'; } else { bn.disabled=false; bn.textContent='Buy Now'; } }
}
function errText(e, fb){
  if(typeof e==='string') return e;
  if(e && typeof e==='object') return e.message || e.error || e.msg || fb;
  return fb || 'Something went wrong';
}
async function addToCart(){
  if(!P.current || P.adding) return;
  const c = mergedProduct();
  // out of stock → don't hit the API (avoids a confusing error)
  if(c.in_stock===false || (P.varData && P.varData.in_stock===false)){
    haptic('err'); toast('This item is out of stock', 'err'); return;
  }
  haptic('med');
  const vid = P.size?.variation_id ?? (Array.isArray(c.sizes)&&c.sizes[0]?.variation_id) ?? 4;
  P.adding = true;
  const btn = document.getElementById('addCartBtn');
  const prev = btn ? btn.innerHTML : '';
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>'; }
  try{
    const d = await api('/api/cart/add', {method:'POST', body:{
      product_id: c.product_id, supplier_id: c.supplier_id,
      variation_id: vid, variation: P.size?.name || '', quantity: P.qty,
      price_type_id: P.varData?.price_type_id || undefined
    }});
    if(d?.success || Array.isArray(d?.items)){
      haptic('ok');
      const total = d?.effective_total || d?.result?.effective_total;
      const qty = d?.total_quantity ?? d?.result?.total_quantity;
      S.cartLoaded = false;
      if(qty!=null) setCartBadge(qty);
      refreshCartBadge();
      openSheet('<div class="cart-ok"><div class="big-check">🎉</div><h3>Yay! Added to cart</h3>' +
        '<p>'+esc(c.name||'Item')+(P.size?.name?' · Size '+esc(P.size.name):'')+' × '+P.qty+'</p>' +
        '<div class="sum">' +
        '<div class="cell"><b>'+rupee(total)+'</b><span>Cart total</span></div>' +
        '<div class="cell"><b>'+esc(qty??'—')+'</b><span>Items in cart</span></div>' +
        '</div><button class="done-btn" onclick="closeSheet()">Keep shopping ✨</button></div>');
      popConfetti();
    }else{
      haptic('err');
      toast(errText(d?.error || d?.message, 'Could not add to cart'), 'err');
    }
  }catch(e){ haptic('err'); toast('Network error — try again', 'err'); }
  P.adding = false;
  if(btn){ btn.disabled = false; btn.innerHTML = prev || 'Add to Cart 🛒'; }
}

/* celebratory confetti burst inside the cart-ok sheet */
function popConfetti(){
  try{
    const host = document.querySelector('.cart-ok');
    if(!host) return;
    const bits = ['✨','🎊','💖','⭐','🫧','💜'];
    for(let i=0;i<12;i++){
      const b = document.createElement('span');
      b.className = 'confetti-bit';
      b.textContent = bits[i % bits.length];
      const ang = (Math.PI*2*i)/12 + Math.random()*.5;
      b.style.setProperty('--cx', Math.round(Math.cos(ang)*(70+Math.random()*70))+'px');
      b.style.setProperty('--cy', Math.round(Math.sin(ang)*(50+Math.random()*60)-30)+'px');
      b.style.animationDelay = (Math.random()*.15)+'s';
      host.appendChild(b);
      setTimeout(()=>b.remove(), 1300);
    }
  }catch(e){}
}

function sanitizeBold(s){
  // allow only <b>/</b> from backend HTML snippets, escape everything else
  return esc(s).replace(/&lt;(\/?b)&gt;/gi, '<$1>');
}
async function cartMutate(path, body){
  const wrap = document.getElementById('cartItemsWrap');
  if(wrap) wrap.classList.add('cart-updating');
  try{
    const d = await api(path, {method:'POST', body});
    if(d?.error){ toast(d.error, 'err'); haptic('err'); }
    else if(d && (Array.isArray(d.items) || d.total_quantity!=null)){
      S.cart = d; S.cartLoaded = true;
      setCartBadge(d.total_quantity);
      const w = d?.warning;
      if(w && w.old_total!=null && w.new_total!=null && Number(w.old_total)!==Number(w.new_total)){
        S.cartWarn = w;
      }
      if(d?.sync){
        if(d.sync.ok) { S.cartSyncOk = true; }
        else if(!S.cartSyncOk || !d.sync.__warned){
          d.sync.__warned = true;
          toast('Meesho cart sync pending: ' + (d.sync.message || 'try again'), 'err');
        }
      }
      haptic('light');
    }else{
      // unknown shape — refetch
      await refreshCartBadge();
    }
  }catch(e){ toast('Update failed — try again', 'err'); haptic('err'); }
  renderCart();
  if(isCheckoutOpen()) renderCheckoutPage();
}
function cartUpdateQty(it, qty, priceTypeId){

    cart_session: S.cart?.cart_session,
    item: {
      identifier: it?.identifier, product_id: it?.product_id, supplier_id: it?.supplier_id,
      variation_id: it?.variation_id, variation: it?.variation, quantity: qty,
      price_type_id: priceTypeId != null ? priceTypeId : it?.price_type_id
    }
  });
}

function renderCart(){
  const el = document.getElementById('tab-cart');
  if(S.tab!=='cart') return;
  const c = S.cart || {};
  const items = Array.isArray(c.items) ? c.items : [];
  let h = '<div class="page-title">My Cart</div>';
  // delivery location strip — only when the cart actually has items
  const a = c?.address;
  const hasAddr = !!(a && (a.id || a.pin || a.address_line_1));
  const noAddr = items.length && !hasAddr;
  if(items.length){
    let locInner;
    if(hasAddr){
      const full = [a.address_line_1, a.address_line_2, a.landmark, a.city, a.state].filter(Boolean).map(esc).join(', ') + (a.pin ? ' - '+esc(a.pin) : '');
      locInner = '<b>'+esc(a.name||'')+'</b>'+(a.mobile?' · '+esc(a.mobile):'') +
        (a.address_type?'<span class="type-badge">'+esc(a.address_type)+'</span>':'') +
        (full?'<span class="l2">'+full+'</span>':'');
    }else{
      locInner = '<b>No delivery address selected</b><span class="l2">Tap “Select” to choose where to deliver</span>';
    }
    h += '<div class="loc-strip'+(noAddr?' loc-warn':'')+'"><span class="li">📍</span><span class="lt">'+locInner+'</span>' +
      '<button class="change" id="locChangeBtn">'+(noAddr?'Select':'Change')+'</button></div>';
  }
  if(noAddr){
    h += '<div class="warn-banner">⚠️ Please select a delivery address before placing your order.</div>';

/* ================= CHECKOUT PAGE (full-screen) ================= */
const CO = { placing:false, pay:'online', pollSeq:0, pollCount:0, order:null, prices:null };
// ── pending UPI order (survives a mini-app refresh) ──
function savePendingUpi(o){ try{ localStorage.setItem('pending_upi_payment', JSON.stringify({...o, ts:o.ts||Date.now()})); }catch(e){} }
function clearPendingUpi(){ try{ localStorage.removeItem('pending_upi_payment'); }catch(e){} }
function loadPendingUpi(){
  try{ const p = JSON.parse(localStorage.getItem('pending_upi_payment')||'null');
    if(p && p.ts && (Date.now()-p.ts) < 20*60*1000 && p.order_num) return p; }catch(e){}
  clearPendingUpi(); return null;
}
async function resumePendingUpi(){
  const p = loadPendingUpi();
  if(!p) return;
  try{ await loadCart(true); }catch(e){}
  CO.order = p; CO.placing = false; CO.prices = CO.prices || {cod:p.amount, online:p.amount};
  if(!isCheckoutOpen()){ S.detailStack.push('checkout'); syncBackButton(); }
  renderPayWait('wait');
  // Check the real state once right away: if it already failed (merchant dead)
  // or got confirmed, surface that instead of re-polling for minutes.
  try{
    const st = await api('/api/order/payment_status', {method:'POST', body:{order_num:p.order_num, cart_session:p.cart_session, juspay_order_id:p.juspay_order_id}});
    if(st?.state==='failed'){ CO.pollSeq++; haptic('err'); clearPendingUpi(); renderPayWait('fail'); return; }
    if(st?.state==='confirmed'){ await confirmOnlineOrder(); return; }
  }catch(e){}
  startPayPolling();
}
function isCheckoutOpen(){ return S.detailStack[S.detailStack.length-1]==='checkout'; }
async function resumeOrderPayment(o){
  // Re-check a pending UPI order straight from the orders list (or called with
  // the order the phone just created). Uses the real payment_status endpoint so
  // it shows the true live state (confirmed / still pending / failed).
  if(!o || !o.order_num){ toast('No order to check', 'err'); return; }
  CO.order = {
    order_num: o.order_num,
    juspay_order_id: o.juspay_order_id || '',
    cart_session: o.cart_session || '',
    amount: o.amount, upi_amount: o.upi_amount || o.amount,
    merchant: o.merchant || {name:'Meesho'}, txn: o.txn || {},
  };
  CO.placing = false; CO.prices = CO.prices || {cod:o.amount, online:o.upi_amount||o.amount};
  if(!isCheckoutOpen()){ S.detailStack.push('checkout'); syncBackButton(); }
  renderPayWait('wait');
  try{
    const st = await api('/api/order/payment_status', {method:'POST', body:{order_num:o.order_num, cart_session:o.cart_session, juspay_order_id:o.juspay_order_id}});
    if(st?.state==='failed'){ CO.pollSeq++; haptic('err'); clearPendingUpi(); renderPayWait('fail'); return; }
    if(st?.state==='confirmed'){ await confirmOnlineOrder(); return; }
  }catch(e){}
  startPayPolling();
}
function openCheckoutPage(){
  const c = S.cart || {};
  const items = Array.isArray(c.items) ? c.items : [];
  if(!items.length){ toast('Your cart is empty'); return; }
  CO.placing = false; CO.order = null; CO.pollSeq++;
  CO.prices = null;   // reset; fetched below (COD vs Online differ)
  if(!isCheckoutOpen()){ S.detailStack.push('checkout'); syncBackButton(); }
  renderCheckoutPage();
  fetchCheckoutPrices();
}
window.openCheckoutPage = openCheckoutPage;
async function fetchCheckoutPrices(){
  const c = S.cart || {};
  try{
    const d = await api('/api/order/prices', {method:'POST', body:{address_id: c?.address?.id || null}});
    if(d && !d.error){ CO.prices = {cod: Number(d.cod), online: (d.online!=null?Number(d.online):null)};
      if(isCheckoutOpen()) renderCheckoutPage(); }
  }catch(e){ /* keep cart-based fallback */ }
}
function coAmounts(){
  const c = S.cart || {};
  const cod = (CO.prices && !isNaN(CO.prices.cod)) ? CO.prices.cod : Number(c?.effective_total ?? c?.total);
  let online;
  if(CO.prices && CO.prices.online!=null && !isNaN(CO.prices.online)) online = CO.prices.online;
  else { const oRaw = c?.effective_online; online = (oRaw!=null && !isNaN(Number(oRaw))) ? Number(oRaw) : cod; }
  // RULE: COD must always be HIGHER than the UPI price. Never let online >= cod.
  if(!isNaN(cod) && !isNaN(online)){
    if(online >= cod){ online = cod; }
    if(online < 1){ online = 0; }
  }
  const save = (!isNaN(cod) && !isNaN(online) && cod - online > 0) ? cod - online : 0;
  return {cod, online, save};
}
function coSelectedAmount(){ const am = coAmounts(); return CO.pay==='cod' ? am.cod : am.online; }

/* ---- ONLINE (UPI) flow ---- */
const PAY_OK = ['SUCCESS','CHARGED','COMPLETED','PAID','TXN_SUCCESS'];
const PAY_FAIL = ['FAILED','EXPIRED','CANCELLED','DECLINED'];
function openUpiLink(){
  try{
    const url = CO.order?.upi_uri || CO.order?.redirect_url;
    if(!url) return;
    if(tg && tg.openLink){ tg.openLink(url); return; }
    // Custom scheme (upi://) needs a real navigation, not window.open.
    const a = document.createElement('a');
    a.href = url;
    a.rel = 'noopener';
    a.style.display = 'none';
    document.body.appendChild(a);
    a.click();
    setTimeout(()=>{ try{ a.remove(); }catch(e){} }, 200);
  }catch(e){}
}
async function startOnlinePay(){
  if(CO.placing) return;
  const addrId = S.cart?.address?.id;
  if(addrId==null){
    haptic('err'); toast('Select a delivery address first', 'err');
    openCartLocationSheet();
    return;
  }
  haptic('med');
  CO.placing = true;
  const btn = document.getElementById('coPlaceBtn');
  if(btn){ btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Starting payment…'; }
  try{
    const d = await api('/api/order/pay_online', {method:'POST', body:{address_id: addrId}});
    if(d?.ok && d.order_num != null){
      haptic('ok');
      CO.order = { order_num: d.order_num, juspay_order_id: d.juspay_order_id,
                   cart_session: d.cart_session, amount: d.amount, upi_amount: d.upi_amount,
                   redirect_url: d.redirect_url,
                   upi_uri: d.upi_uri, qr_image: d.qr_image, share_message: d.share_message,
                   package_name: d.package_name, merchant: d.merchant,
                   txn: d.txn, ts: Date.now() };
      savePendingUpi(CO.order);
      CO.placing = false;
      renderPayWait('wait');
      if(d.upi_uri){ openUpiLink(); }
      else if(d.resume){ toast(errText(d.message, 'A payment is already in progress — checking status…')); }
      // Surface the backend's immediate payment verdict so an already-failed
      // ("merchant dead") or already-confirmed order doesn't sit in "Waiting…"
      // for minutes.
      const pstate = String(d.payment_state||'').toLowerCase();
      if(pstate==='failed'){
        CO.pollSeq++; haptic('err'); clearPendingUpi();
        renderPayWait('fail'); return;
      }
      if(pstate==='confirmed'){
        await confirmOnlineOrder(); return;
      }
      startPayPolling();
      return;
    }
    haptic('err');
    if(d?.error==='no_address'){
      toast(errText(d?.message, 'Please select a delivery address'), 'err');
      openCartLocationSheet();
    }else{
      toast(errText(d?.message || d?.error, 'Could not start payment'), 'err');
    }
  }catch(e){ haptic('err'); toast('Network error — try again', 'err'); }
  CO.placing = false;
  const btn2 = document.getElementById('coPlaceBtn');
  if(btn2){ btn2.disabled = false; btn2.textContent = 'Place Order'; }
}
function startPayPolling(){
  const seq = ++CO.pollSeq;
  CO.pollCount = 0;
  let delay = 2500;
  const tick = async ()=>{
    if(seq !== CO.pollSeq || !CO.order || !S.detailStack.length) return;
    let done = false;
    try{ done = await pollPaymentOnce(true); }catch(e){ done = false; }
    if(done || seq !== CO.pollSeq) return;
    CO.pollCount++;
    if(CO.pollCount >= 45){ renderPayWait('manual'); return; }
    delay = Math.min(12000, Math.round(delay * 1.5));
    setTimeout(tick, delay);
  };
  // Check fast right after the order lands (catches instant UPI confirms),
  // then back off capped at 12s. ~3.5 min before falling to manual.
  setTimeout(tick, 1200);
}
async function pollPaymentOnce(silent){
  if(!CO.order) return true;
  try{
    const d = await api('/api/order/payment_status', {method:'POST', body:{order_num: CO.order.order_num, cart_session: CO.order.cart_session, juspay_order_id: CO.order.juspay_order_id}});
    const st = String(d?.status||'').toUpperCase();
    const ok = d?.state==='confirmed' || d?.state==='success' ||
               (!d?.state && PAY_OK.indexOf(st) >= 0);
    const fail = d?.state==='failed' || (!d?.state && PAY_FAIL.indexOf(st) >= 0);
    if(ok){ await confirmOnlineOrder(); return true; }
    if(fail){ CO.pollSeq++; haptic('err'); clearPendingUpi(); renderPayWait('fail'); return true; }
    if(!silent) toast('Payment still pending — complete it in your UPI app');
  }catch(e){
    if(!silent) toast('Could not check payment status — try again', 'err');
  }
  return false;
}
async function confirmOnlineOrder(){
  CO.pollSeq++; // stop auto-polling
  const ord = CO.order;
  if(!ord) return;
  try{
    const d = await api('/api/order/confirm', {method:'POST', body:{order_num: ord.order_num, cart_session: ord.cart_session}});
    if(d?.ok){
      haptic('ok');
      clearPendingUpi();
      CO.order = null;
      S.cartLoaded = false; S.ordersLoaded = false; S.cartWarn = null;
      closeDetail(true);
      if(S.tab==='cart') loadCart(true); else refreshCartBadge();
      showOrderSuccess(ord.order_num, ord.upi_amount || ord.amount, d?.message || 'Payment received — your order is confirmed!', 'Paid online');
      return;
    }
    haptic('err');
    toast(errText(d?.message || d?.error, 'Could not confirm order — tap "Check payment status"'), 'err');
    renderPayWait('manual');
  }catch(e){
    haptic('err');
    toast('Network error — tap "Check payment status"', 'err');
    renderPayWait('manual');
  }
}
function renderPayWait(state){
  if(!S.detailStack.length) return;
  const ord = CO.order || {};
  let inner;
  if(state==='fail'){
    inner = '<div class="pay-wait"><div class="fail-art">💔</div><h3>Payment failed</h3>' +
      '<div class="amt">'+rupee(ord.upi_amount || ord.amount)+'</div>' +
      '<p>Your payment didn’t go through. If money was deducted, it will be refunded automatically.</p>' +
      '<button class="upi-btn" id="payRetryBtn">Try again</button>' +
      '<button class="upi-btn ghost" onclick="closeDetail()">Back to cart</button></div>';
  }else{
    const manual = state==='manual';
    const qr = ord.qr_image
      ? '<div class="upi-qr"><img src="'+escapeHtml(ord.qr_image)+'" alt="UPI QR" width="220" height="220"'
        + ' onerror="this.parentNode.style.display=\'none\'">'
        + '<div class="qr-cap">Scan with any UPI app to pay</div></div>'
      : (ord.upi_uri
        ? '<div class="upi-qr"><img src="https://api.qrserver.com/v1/create-qr-code/?size=220x220&margin=8&data='
          + encodeURIComponent(ord.upi_uri) + '" alt="UPI QR" width="200" height="200"'
          + ' onerror="this.parentNode.style.display=\'none\'">'
          + '<div class="qr-cap">Scan with any UPI app to pay</div></div>'
        : '');
    inner = '<div class="pay-wait">' +
      (manual
        ? '<div class="fail-art" style="background:var(--sun-bg)">⏳</div><h3>Still waiting…</h3>'
        : '<div class="big-spin"></div><h3>Waiting for payment…</h3>') +
      '<div class="amt">'+rupee(ord.upi_amount || ord.amount)+'</div>' +
      '<div class="merchant-badge">' +
        '<div class="merch-name">'+escapeHtml((ord.merchant && ord.merchant.name) || 'Meesho')+'</div>' +
        '<div class="merch-vpa">'+escapeHtml((ord.merchant && ord.merchant.vpa) || (ord.qr_image ? 'UPI QR · scan to pay' : ''))+'</div>' +
        '<div class="merch-txn">Order '+escapeHtml(String(ord.order_num||''))+
          ((ord.txn && (ord.txn.transaction_id || ord.txn.order_id)) ? ' &middot; TXN '+escapeHtml(String((ord.txn.transaction_id || ord.txn.order_id)).slice(0,12)) : '')+'</div>' +
      '</div>' +
      '<p>'+(manual
        ? 'We haven’t seen your payment yet. If you’ve paid, tap “Check payment status” below.'
        : 'We opened your UPI app for the real Meesho payment — complete it there and we’ll confirm automatically.')+'</p>' +
      qr +
      (ord.share_message ? '<div style="background:var(--sky-bg);color:var(--sky);border-radius:14px;padding:10px 14px;margin:8px 0;font-size:12px;font-weight:700;white-space:pre-line">'+escapeHtml(ord.share_message)+'</div>' : '') +
      '<button class="upi-btn" id="upiOpenBtn">📲 Pay with UPI app</button>' +
      '<button class="upi-btn ghost" id="paidBtn">'+(manual ? 'Check payment status' : 'I’ve paid — check now')+'</button>' +
      '<button class="upi-btn danger" id="payClearBtn">🗑 Clear / Cancel payment</button></div>';
  }
  document.getElementById('detailHost').innerHTML =
    '<div class="detail"><div class="detail-top"><button class="back-btn" onclick="closeDetail()">←</button>' +
    '<div class="ttl">'+(state==='fail' ? 'Payment failed' : 'Pay Online (UPI)')+'</div></div>' + inner + '</div>';
  window.scrollTo(0,0);
  const ob = document.getElementById('upiOpenBtn');
  if(ob) ob.addEventListener('click', ()=>{ haptic('light'); openUpiLink(); });
  const pbn = document.getElementById('paidBtn');
  if(pbn) pbn.addEventListener('click', async ()=>{
    haptic('med');
    const prev = pbn.textContent;
    pbn.disabled = true; pbn.innerHTML = '<span class="spinner"></span>';
    let done = false;
    try{ done = await pollPaymentOnce(false); }catch(e){ done = false; }
    if(!done){
      const p2 = document.getElementById('paidBtn');
      if(p2){ p2.disabled = false; p2.textContent = prev; }
    }
  });
  const clr = document.getElementById('payClearBtn');
  if(clr) clr.addEventListener('click', ()=>{
    haptic('med');
    clearPendingUpi();
    CO.order = null; CO.pollSeq++; CO.prices = null;
    toast('Payment cleared', 'ok');
    closeDetail(true);
    if(S.tab==='cart') loadCart(true);
  });
  const rb = document.getElementById('payRetryBtn');
  if(rb) rb.addEventListener('click', ()=>{
    haptic('med');
    clearPendingUpi();
    CO.order = null; CO.pollSeq++;
    renderCheckoutPage();
    startOnlinePay();
  });
}

function isDefaultAddr(a){
  const d = S.addrDefault;

  return d.name===a.name && String(d.pin||'')===String(a.pin||'');

    const set=(id,v)=>{ const el=document.getElementById(id); if(el && v!=null) el.value = v; };
    set('afName', ed.name); set('afMobile', ed.mobile); set('afPin', ed.pin);
    set('afAltMobile', ed.alternative_mobile);
    set('afCity', ed.city); set('afState', ed.state);
    set('afL1', ed.address_line_1); set('afL2', ed.address_line_2); set('afLandmark', ed.landmark);
  }
  // type chips
  document.getElementById('typeChips').addEventListener('click', e=>{
    const b = e.target.closest('.type-chip'); if(!b) return;
    haptic('light'); AF.type = b.dataset.t;
    document.querySelectorAll('.type-chip').forEach(x=>x.classList.toggle('on', x===b));
  });
  // geocode search (debounced)
  const gi = document.getElementById('geoInput');
  gi.addEventListener('input', ()=>{
    clearTimeout(AF.geoTimer);
    const q = gi.value.trim();
    if(q.length < 3){ hideGeoResults(); return; }
    AF.geoTimer = setTimeout(()=>geoSearch(q), 400);
  });
  const goNow = ()=>{ clearTimeout(AF.geoTimer); const q = gi.value.trim(); if(q.length>=2) geoSearch(q); };
  document.getElementById('geoGoBtn').addEventListener('click', ()=>{ haptic('light'); goNow(); });
  gi.addEventListener('keydown', e=>{ if(e.key==='Enter'){ e.preventDefault(); goNow(); } });
  document.getElementById('useLocBtn').addEventListener('click', useCurrentLocation);

  document.getElementById('saveAddrBtn').addEventListener('click', saveAddress);

}
function initAddrMap(){
  try{
    if(!window.L || !document.getElementById('addrMap')){
      const mw = document.querySelector('.map-wrap'); if(mw) mw.style.display = 'none';
      const mh = document.querySelector('.map-hint'); if(mh) mh.style.display = 'none';
      return;
    }
    if(AF.map){ try{ AF.map.remove(); }catch(e){} AF.map = null; AF.marker = null; }
    const start = [22.9734, 78.6569]; // India
    const map = L.map('addrMap', {zoomControl:true, attributionControl:false}).setView(start, 5);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxZoom:19}).addTo(map);
    const marker = L.marker(start, {draggable:true}).addTo(map);
    marker.on('dragend', ()=>{
      const p = marker.getLatLng();
      reverseGeo(p.lat, p.lng);
    });
    map.on('click', e=>{
      marker.setLatLng(e.latlng);
      reverseGeo(e.latlng.lat, e.latlng.lng);
    });
    AF.map = map; AF.marker = marker;
    setTimeout(()=>{ try{ map.invalidateSize(); }catch(e){} }, 250);
  }catch(e){
    const mw = document.querySelector('.map-wrap'); if(mw) mw.style.display = 'none';
  }
}
function setMapPos(lat, lng, zoom){
  try{
    if(!AF.map || !AF.marker || lat==null || lng==null) return;
    AF.marker.setLatLng([lat, lng]);
    AF.map.setView([lat, lng], zoom || Math.max(AF.map.getZoom(), 15));
  }catch(e){}
}
async function reverseGeo(lat, lng, accuracy){
  AF.coords = { latitude:String(lat), longitude:String(lng), accuracy:String(accuracy||'20') };
  const cp = document.getElementById('coordPill');
  if(cp) cp.innerHTML = '<span class="coord-pill">✓ Location pinned</span>';
  try{
    const d = await api('/api/geocode', {q:{lat, lng}});
    const r = (Array.isArray(d?.results) && d.results[0]) || null;
    if(r) applyGeoResult({...r, lat, lng}, accuracy||'20', true);
  }catch(e){ /* keep pin */ }
}
async function useMyAddress(){
  haptic('light');
  const btn = document.getElementById('useMyAddrBtn');
  if(btn){ btn.disabled = true; btn.textContent = 'Loading…'; }
  const reset = ()=>{ if(btn){ btn.disabled = false; btn.textContent = '🏠 Use my address'; } };
